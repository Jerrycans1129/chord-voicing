<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a1b"><title>Voicing — 和弦转位训练</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head><body>
<main><section id="instrument" class="instrument" aria-label="和弦掉落区和 C3 至 C6 参照键盘">
<div id="lanes"></div><div id="falling"></div>
<section id="overlay" aria-label="训练主页">
<header class="app-heading"><h1>VOICING <span>和弦转位训练</span></h1><span id="version"></span></header>
<div class="home-content"><nav id="route" aria-label="可拖动的训练链"></nav>
<div class="stage-summary"><h2 id="selected-stage"></h2><p id="stage-detail"></p><p id="last-result" hidden></p></div></div>
<div class="home-action"><button id="overlay-action" class="primary" type="button">开始训练</button></div>
</section>
<button id="settings-toggle" class="secondary" type="button" aria-label="打开训练设置" title="训练设置"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2-.6-2 3.5 1.5 1.6v2.8L2.4 15l2 3.5 2-.6 2 .9L9 21h4l.6-2.2 2-.9 2 .6 2-3.5-1.5-1.6v-2.8l1.5-1.6-2-3.5-2 .6-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg></button>
<div id="strike"></div><div id="keyboard" aria-label="无音名标记的钢琴参照键盘"></div><div id="keyboard-frost" aria-hidden="true" hidden></div>
</section></main>
<dialog id="settings-dialog" aria-labelledby="settings-title">
<h2 id="settings-title">设置</h2>
<div class="dialog-content">
<label class="speed-setting" for="speed">速度<select id="speed"></select></label>
<div class="switch-row"><span>节拍器</span><button id="metronome" class="secondary" type="button" aria-pressed="true">节拍器：开</button></div>
<label id="keyboard-blur-setting" class="switch-row" for="keyboard-blur"><span>遮挡／隐藏琴键</span><input id="keyboard-blur" type="checkbox" checked></label>
<div class="midi-settings"><div class="midi-actions"><button id="midi-connect" class="secondary" type="button">连接 MIDI</button><button id="midi-clear" class="secondary" type="button">清除亮键</button></div><p id="midi-status" role="status"></p><p id="midi-notes"></p></div>
<div id="session-stats" hidden><div><span>训练时间</span><strong id="count">00:00 / 30:00</strong></div><div><span>正确／已结束题数</span><strong id="answer-count">0 / 0</strong></div><div><span>正确率</span><strong id="accuracy">—</strong></div></div>
<section class="timing-stats" aria-labelledby="timing-title"><h3 id="timing-title">弹奏时机统计</h3><p id="timing-summary"></p><p id="timing-detail"></p><p id="timing-storage"></p><button id="timing-export" class="secondary" type="button">导出弹奏数据</button></section>
</div><div class="dialog-actions"><button id="exit-training" class="secondary" type="button" hidden>退出训练</button><button id="settings-close" class="primary" type="button" autofocus>关闭</button></div>
</dialog>
<dialog id="midi-warning" aria-labelledby="midi-warning-title" aria-describedby="midi-warning-description">
<h2 id="midi-warning-title">尚未连接 MIDI 设备</h2>
<p id="midi-warning-description">请先连接 MIDI 设备，再开始训练。</p>
<div class="midi-warning-actions"><button id="midi-warning-connect" class="secondary" type="button">连接 MIDI</button><button id="midi-warning-close" class="primary" type="button" autofocus>知道了</button></div>
</dialog>
<aside id="rotate"><span>↻</span><h2>横过来，更好练。</h2><p>请将手机或平板旋转为横屏。<br>琴键是位置参照，请在实体乐器上弹奏。</p></aside><script type="module" src="./app.js"></script><script src="./pwa.js" defer></script></body></html>
