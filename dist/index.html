<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a1b"><title>Voicing — 和弦转位训练</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head><body>
<main><section id="instrument" class="instrument" aria-label="和弦掉落区和 C3 至 C6 参照键盘">
<div id="lanes"></div><div id="falling"></div><div id="timer" class="training-hint" aria-label="本次训练时长">00:00</div>
<section id="overlay" aria-label="训练设置"><div class="panel-heading"><div><span class="eyebrow">VOICING · 和弦转位训练 · v0.0.2</span><h1>准备训练</h1></div><div class="counter"><strong id="count">00:00</strong><span> / 30:00</span></div></div>
<div class="settings"><div class="stage-control"><label for="stage">训练阶段 <span id="stage-number"></span></label><select id="stage"></select></div><div class="tempo"><label for="speed">速度（每分钟拍数） <output id="speed-value">60 BPM</output></label><div class="tempo-controls"><select id="speed"><option value="40">40 BPM</option><option value="50">50 BPM</option><option value="60" selected>60 BPM</option><option value="70">70 BPM</option><option value="80">80 BPM</option><option value="90">90 BPM</option><option value="100">100 BPM</option><option value="110">110 BPM</option><option value="120">120 BPM</option></select><button id="metronome" class="secondary" type="button" aria-pressed="true">节拍器：开</button></div></div></div>
<fieldset id="note-range"><legend>音名练习范围</legend><label><input id="note-all" name="note-range" type="radio" value="all" checked>全部 12 个键</label><label><input id="note-black" name="note-range" type="radio" value="black">仅 5 个黑键</label></fieldset>
<label id="keyboard-blur-setting" class="keyboard-blur-setting" for="keyboard-blur"><input id="keyboard-blur" type="checkbox" checked>训练时模糊遮挡琴键</label>
<div class="midi-settings"><div class="midi-actions"><button id="midi-connect" class="secondary" type="button">连接 MIDI</button><button id="midi-clear" class="secondary" type="button">清除亮键</button></div><span id="midi-status" role="status"></span><span id="midi-notes"></span></div>
<div class="panel-bottom"><div class="actions"><button id="restart" class="secondary">重新开始</button><button id="overlay-action" class="primary">开始训练 →</button></div></div>
<div class="install-row"><button id="install-app" class="secondary" type="button" hidden>安装 App</button><span id="install-status" role="status"></span></div>
<p id="status" role="status">标记落到琴键上沿时，在实体乐器上弹奏。</p></section>
<button id="settings-toggle" class="secondary" type="button" aria-label="打开训练设置" title="训练设置" hidden><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2-.6-2 3.5 1.5 1.6v2.8L2.4 15l2 3.5 2-.6 2 .9L9 21h4l.6-2.2 2-.9 2 .6 2-3.5-1.5-1.6v-2.8l1.5-1.6-2-3.5-2 .6-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg></button>
<div id="strike"></div><div id="keyboard" aria-label="无音名标记的钢琴参照键盘"></div><div id="keyboard-frost" aria-hidden="true" hidden></div>
</section></main><aside id="rotate"><span>↻</span><h2>横过来，更好练。</h2><p>请将手机或平板旋转为横屏。<br>琴键是位置参照，请在实体乐器上弹奏。</p></aside><script type="module" src="./app.js"></script><script src="./pwa.js" defer></script></body></html>
